name: Build and verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-integration:
    name: Rust, .NET, SQLCipher and cross-process tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            target
          key: ${{ runner.os }}-verify-${{ hashFiles('Cargo.lock', 'runtime/**/packages.lock.json', 'global.json') }}
      - name: Rust formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests and shipped CLI
        run: |
          cargo test --workspace --locked
          cargo build --workspace --locked
      - name: .NET restore and build
        run: |
          dotnet restore runtime/Tpcli.slnx --locked-mode
          dotnet build runtime/Tpcli.slnx --no-restore
      - name: .NET formatting and tests
        run: |
          dotnet format runtime/Tpcli.slnx --verify-no-changes --no-restore
          dotnet test runtime/Tpcli.slnx --no-build
      - name: Real cross-language process integration and chaos
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  public-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject private runtime artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env([.]|$)|history[.]db|control[.]db)|[.](pfx|pem|key|sqlite|db)(-wal|-shm)?$'; then
            echo "::error::Private runtime or credential artifacts must not be tracked."
            exit 1
          fi
      - name: Compile infrastructure without deployment
        env:
          AZURE_CORE_COLLECT_TELEMETRY: '0'
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
